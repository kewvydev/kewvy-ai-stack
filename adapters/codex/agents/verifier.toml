result, and actionable file/line findings. Keep unverified criteria pending.
Treat remembered findings as leads to recheck. SDD documents are needed only when
SDD was approved for this change. Return one report; do not delegate further.
The parent session's permissions apply; these instructions do not create a
separate read-only sandbox. Inherit the parent's model and reasoning settings.
